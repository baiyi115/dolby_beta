name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # AGP 8.9.1 refuses to run on Java 8; the plugin requires JDK 17 or newer.
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Ships the freshest UnblockNeteaseMusic script. Deliberately non-fatal, and it only replaces
      # the bundled zip after the new one exists, so an upstream outage cannot fail the build or
      # leave the asset missing.
      - name: Sync latest Unblocked Music source code
        continue-on-error: true
        run: |
          git clone --depth=1 https://github.com/luoxingran/server.git
          (cd server && zip -rq ../UnblockNeteaseMusic.zip .)
          rm -rf server
          mv -f UnblockNeteaseMusic.zip app/src/main/assets/UnblockNeteaseMusic.zip

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # signing.properties and the keystore are kept out of the repository, so CI rebuilds
      # them from secrets. When KEYSTORE_BASE64 is unset the step still succeeds and the
      # release variant builds unsigned, matching build.gradle's four-property check.
      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 not configured; building unsigned"
            exit 0
          fi
          # app/build.gradle resolves KEYSTORE_FILE relative to the app module.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/lin.jks
          {
            printf 'KEYSTORE_FILE = ./lin.jks\n'
            printf 'KEYSTORE_PASSWORD = %s\n' "$KEYSTORE_PASSWORD"
            printf 'KEY_ALIAS = %s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD = %s\n' "$KEY_PASSWORD"
          } > app/signing.properties
          echo "signing material restored"

      # Upstream commit a5e8871 published app/lin.jks together with its password (123456), so
      # that private key is public and anyone can forge an update signed with it. Refuse to
      # build a release with it: generate a new keystore and update the KEY_* secrets.
      - name: Reject the publicly committed keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "no keystore configured; nothing to check"
            exit 0
          fi
          FINGERPRINT=$(keytool -list -v -keystore app/lin.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d '[:space:]')
          PUBLIC_FINGERPRINT='F7:D3:7C:14:22:9E:80:88:B8:AF:0B:70:FB:1B:D0:1B:0D:59:F3:1D:89:A4:55:94:CD:04:5F:42:FF:34:9A:BD'
          if [ "$FINGERPRINT" = "$PUBLIC_FINGERPRINT" ]; then
            echo "::error::KEYSTORE_BASE64 is the keystore published in upstream commit a5e8871 (password 123456). Its private key is public, so signatures made with it prove nothing. Generate a new keystore and update the KEY_* secrets."
            exit 1
          fi
          echo "keystore SHA256: $FINGERPRINT"

      - name: Build with Gradle
        run: ./gradlew app:assembleRelease

      - name: Verify APK is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if unzip -l "$APK" | grep -q 'META-INF/CERT.RSA'; then
            echo "signed: $APK"
          else
            echo "::warning::APK is unsigned (no signing secrets configured)"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{github.workspace}}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
