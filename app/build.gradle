apply plugin: 'com.android.application'

Properties props = new Properties()

// A missing signing.properties must not break configuration: without it the release variant simply
// builds unsigned, which is what lets the keystore and its passwords stay out of the repository.
def signingPropsFile = file("signing.properties")
if (signingPropsFile.exists())
    props.load(new FileInputStream(signingPropsFile))

android {
    namespace 'com.raincat.dolby_beta'
    ndkVersion "26.1.10909125"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.raincat.dolby_beta"
        minSdkVersion 23
        targetSdkVersion 29
        versionCode 390
        versionName "3.9.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // CI has no keystore, so only apply the release signing config when the local Gradle props
    // provide one. Without it the release variant still builds (unsigned) and CI stays green.
    def hasReleaseSigning = ['KEY_ALIAS', 'KEY_PASSWORD', 'KEYSTORE_FILE', 'KEYSTORE_PASSWORD']
            .every { props.containsKey(it) }

    // libnode.so is executed as a file (not dlopen'd), so it must be extracted on install. This is
    // what keeps that guarantee when targetSdk or the AGP default for jniLibs packaging changes.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias props['KEY_ALIAS']
                keyPassword props['KEY_PASSWORD']
                storeFile file(props['KEYSTORE_FILE'])
                storePassword props['KEYSTORE_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "LOG_DEBUG", "false" //不显示log
            shrinkResources false //资源压缩
            minifyEnabled false //混淆
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    applicationVariants.all {
        variant ->
            variant.outputs.all {
                //只处理生产版本
                if (buildType.name == 'release') {
                    // "yyyy" (calendar year), not "YYYY" (week-based year): around New Year the
                    // latter put the next year into the file name.
                    def createTime = new Date().format("yyyyMMdd", TimeZone.getTimeZone("GMT+08:00"))
                    // app包名称
                    outputFileName = "dolby_beta_" + defaultConfig.versionName + "_" + createTime + "-" + buildType.name + ".apk"
                }
            }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    //xposed库：libxposed modern API（旧de.robv已全部清除）
    compileOnly 'io.github.libxposed:api:102.0.0'
    //DexKit 运行时查找混淆方法
    implementation 'org.luckypray:dexkit:2.3.0'
    implementation 'com.annimon:stream:1.2.2'
    implementation 'org.smali:dexlib2:2.3.4'
    implementation 'com.google.guava:guava:28.2-android'
    implementation 'com.google.code.gson:gson:2.8.9'
}
